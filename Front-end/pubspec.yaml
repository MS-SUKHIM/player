name: flutter_application_1
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  permission_handler: ^11.3.1

  # المشغل الرسمي والإيماءات
  video_player: ^2.8.6
  path_provider: ^2.1.2
  get_thumbnail_video: ^0.7.3
  screen_brightness: ^0.2.2
  volume_controller: ^3.5.0

  # التخزين واختيار الملفات
  shared_preferences: ^2.2.3
  file_picker: ^8.0.0

  # تحديث share_plus لتتطابق مع إصدار الويب الخاص بـ get_thumbnail_video
  share_plus: ^10.1.4
  dio: ^5.4.3

  # مكاتب Firebase متوافقة
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
